name: backend-ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: olympicpark
          POSTGRES_USER: olympic
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olympic -d olympicpark"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI 안에서만 쓰는 임시 DB라 실제 비밀번호가 아님
      DATABASE_URL: postgresql+psycopg://olympic:ci-only-password@localhost:5432/olympicpark
      CORS_ORIGINS: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: pip install -r requirements.lock
      - name: Migrate
        run: alembic upgrade head
      - name: Check missing migration
        run: alembic check
      - name: Test
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t data-be:ci .
