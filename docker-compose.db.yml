# 서버(db VM)용 PostgreSQL. 로컬 개발은 docker-compose.yml의 db를 쓴다.
#
# 실행 (db VM의 /opt/olympark/db 에서, .env에 POSTGRES_* 값):
#   docker compose -f docker-compose.db.yml up -d
#
# network_mode: host 를 쓰는 이유: VM 방화벽(firewalld)이 그대로 적용되게 하려고.
# 5432번은 VM 방화벽에서 backend-1·2(10.10.2.31, 10.10.2.32)만 허용한다.
# db VM은 인터넷이 막혀 있어서 이미지는 미리 받아 둔다 (postgres:16).

services:
  db:
    image: postgres:16
    env_file: .env
    network_mode: host
    command: ["postgres", "-c", "listen_addresses=${DB_LISTEN_ADDRESS:-127.0.0.1}"]
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
